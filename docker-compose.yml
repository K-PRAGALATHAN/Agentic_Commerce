services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: agentic
      POSTGRES_PASSWORD: agentic
      POSTGRES_DB: agentic
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentic"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgres://agentic:agentic@postgres:5432/agentic
      REDIS_URL: redis://redis:6379
      BACKEND_PORT: 4000
      MIGRATIONS_DIR: /app/infra/migrations
    volumes:
      # infra/ is outside the backend build context — mount migrations in for the runner.
      - ./infra/migrations:/app/infra/migrations:ro
      # Mount source for hot-reload (tsx watch) without rebuilding the image.
      - ./backend/src:/app/src
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -c "npm run migrate && npm run dev"

  agent-service:
    build: ./agent-service
    env_file: .env
    environment:
      AGENT_PORT: 8000
      BACKEND_URL: http://backend:4000
    volumes:
      - ./agent-service/src:/app/src
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    depends_on:
      - backend

  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: http://backend:4000
      AGENT_URL: http://agent-service:8000
    volumes:
      # Mount source for Vite hot-reload without rebuilding the image.
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.ts:/app/vite.config.ts
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata:
